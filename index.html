<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bajaj Spare Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#0a2e5c;
  --bg:#f2f5f9;
  --card:#ffffff;
  --text:#000;
  --danger:#c62828;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
}

/* MOBILE HEADER */
.mobileHeader{
  display:none;
  background:var(--blue);
  color:white;
  padding:10px;
  align-items:center;
  gap:10px;
}
.mobileHeader button{
  background:none;
  border:none;
  color:white;
  font-size:22px;
}

/* LAYOUT */
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:var(--blue);
  color:white;
  padding:15px;
  display:flex;
  flex-direction:column;
}
.sidebar h2{
  text-align:center;
  margin-bottom:20px;
}

.nav button{
  background:none;
  border:none;
  color:white;
  text-align:left;
  padding:10px;
  border-radius:6px;
  margin-bottom:5px;
}
.nav button:hover{
  background:rgba(255,255,255,0.15);
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow-y:auto;
}
.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.low{color:var(--danger);font-weight:bold}

.btnRow{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.btnRow button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
  color:white;
}
.reduce{background:var(--danger)}
.edit{background:#455a64}
.delete{background:#000}

.whatsapp{
  display:inline-block;
  margin-top:6px;
  padding:6px 10px;
  background:#25D366;
  color:white;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .mobileHeader{display:flex}
  .sidebar{
    position:fixed;
    left:-260px;
    top:0;
    height:100%;
    transition:.3s;
    z-index:1000;
  }
  .sidebar.show{left:0}
  .app{flex-direction:column}
}
</style>
</head>

<body>

<div class="mobileHeader">
  <button onclick="toggleSidebar()">☰</button>
  <b>Bajaj Spare Stock</b>
</div>

<div class="app">

  <div class="sidebar">
    <h2>Bajaj<br>Stock</h2>
    <div class="nav">
      <button onclick="navAction(showDashboard)">🏠 Dashboard</button>
      <button onclick="navAction(showStock)">📦 Stock</button>
      <button onclick="navAction(showHistory)">📜 History</button>
      <button onclick="toggleTheme()">🌙 Toggle Theme</button>
      <button onclick="backupData()">💾 Backup</button>
      <button onclick="triggerRestore()">♻️ Restore</button>
      <button onclick="clearHistoryOnce(this)">🧹 Clear History (Once)</button>
    </div>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<input type="file" id="restoreFile" accept=".json" style="display:none">

<script>
/* THEME */
if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark");
}
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme",
    document.body.classList.contains("dark")?"dark":"light");
}

/* SIDEBAR */
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("show");
}
function navAction(fn){
  fn();
  if(window.innerWidth<=768){
    document.querySelector(".sidebar").classList.remove("show");
  }
}

/* DATA */
if(!localStorage.getItem("pin")) localStorage.setItem("pin","2580");
let stock=JSON.parse(localStorage.getItem("stock"))||{};
function getHistory(){
  return JSON.parse(localStorage.getItem("history"))||[];
}

/* DASHBOARD */
function showDashboard(){
  mainContent.innerHTML=`
    <div class="card">
      <h3>Dashboard</h3>
      <p>Welcome to Bajaj Spare Stock Management</p>
    </div>`;
}

/* STOCK */
function showStock(){
  let html=`<div class="card"><button onclick="addPart()">➕ Add Spare</button></div>`;
  for(let i in stock){
    let low=stock[i]<=5?'<span class="low"> ⚠ LOW</span>':'';
    html+=`
      <div class="card">
        <b>${i}</b><br>
        Available: ${stock[i]} ${low}
        <div class="btnRow">
          <button class="reduce" onclick="reduceStock('${i}')">Reduce</button>
          <button class="edit" onclick="editStock('${i}')">Edit</button>
          <button class="delete" onclick="deleteStock('${i}')">Delete</button>
        </div>
      </div>`;
  }
  if(!Object.keys(stock).length)
    html+=`<div class="card">No stock added</div>`;
  mainContent.innerHTML=html;
  localStorage.setItem("stock",JSON.stringify(stock));
}

function addPart(){
  let n=prompt("Spare name:");
  let q=prompt("Quantity:");
  if(!n||q<0||stock[n])return;
  stock[n]=Number(q);
  showStock();
}
function editStock(i){
  if(prompt("Owner PIN")!==localStorage.getItem("pin"))return;
  let q=prompt("New qty:");
  if(q<0)return;
  stock[i]=Number(q);
  showStock();
}
function deleteStock(i){
  if(prompt("Owner PIN")!==localStorage.getItem("pin"))return;
  delete stock[i];
  showStock();
}
function reduceStock(i){
  let qty=prompt("Qty:");
  let cust=prompt("Customer name:");
  let phone=prompt("Phone (10 digits):");
  let vehicle=prompt("Vehicle no:");
  if(!/^\d{10}$/.test(phone)||stock[i]<qty)return;
  stock[i]-=qty;
  let h=getHistory();
  h.unshift({i,qty,cust,phone,vehicle,time:new Date().toLocaleString()});
  localStorage.setItem("history",JSON.stringify(h));
  showStock();
}

/* HISTORY */
function showHistory(){
  let h=getHistory();
  if(!h.length){
    mainContent.innerHTML=`<div class="card">No history</div>`;
    return;
  }
  let html=`<div class="card"><h3>History</h3></div>`;
  h.forEach(x=>{
    html+=`
      <div class="card">
        <b>${x.cust}</b> (${x.phone})<br>
        ${x.vehicle}<br>
        ${x.i} - ${x.qty}<br>
        <small>${x.time}</small><br>
        <a class="whatsapp"
        href="https://wa.me/91${x.phone}" target="_blank">WhatsApp</a>
      </div>`;
  });
  mainContent.innerHTML=html;
}

/* CLEAR HISTORY ONCE */
function clearHistoryOnce(btn){
  if(!confirm("Clear history once?"))return;
  localStorage.removeItem("history");
  btn.remove();
  showDashboard();
}

/* BACKUP */
function backupData(){
  let data={stock,history:getHistory(),time:new Date().toLocaleString()};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="bajaj-backup.json";
  a.click();
}

/* RESTORE */
function triggerRestore(){
  if(prompt("Owner PIN")!==localStorage.getItem("pin"))return;
  restoreFile.click();
}
restoreFile.onchange=function(){
  let r=new FileReader();
  r.onload=e=>{
    let d=JSON.parse(e.target.result);
    stock=d.stock||{};
    localStorage.setItem("stock",JSON.stringify(stock));
    localStorage.setItem("history",JSON.stringify(d.history||[]));
    alert("Restored");
    showDashboard();
  };
  r.readAsText(this.files[0]);
};

showDashboard();
</script>

</body>
</html>
