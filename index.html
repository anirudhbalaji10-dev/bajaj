<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balaji Motors – Anavatti</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.big-btn {
  padding: 16px !important;
  font-size: 18px !important;
  border-radius: 10px;
}
:root{
  --blue:#0a2e5c;
  --bg:#f2f5f9;
  --card:#ffffff;
  --text:#000;
  --danger:#c62828;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
}

/* SPLASH */
#splash{
  position:fixed;inset:0;
  background:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{width:160px}
#splash h2{color:var(--blue);margin:10px 0 0}
#splash small{letter-spacing:1px}

/* MOBILE HEADER */
.mobileHeader{
  display:none;
  background:var(--blue);
  color:#fff;
  padding:10px;
  align-items:center;
  gap:10px;
}
.mobileHeader button{
  background:none;border:none;color:#fff;font-size:22px;
}

/* LAYOUT */
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:var(--blue);
  color:#fff;
  padding:15px;
}
.sidebar h2{text-align:center;margin-bottom:15px}
.sidebar button{
  width:100%;
  background:none;
  border:none;
  color:#fff;
  text-align:left;
  padding:10px;
  border-radius:6px;
  margin-bottom:5px;
}
.sidebar button:hover{background:rgba(255,255,255,.15)}

/* MAIN */
.main{flex:1;padding:20px;overflow:auto}
.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.low{color:var(--danger);font-weight:bold}
.btnRow{display:flex;gap:6px;margin-top:6px;flex-direction: row;}
.btnRow button{flex:1;padding:8px;border:none;border-radius:6px;color:#fff}
.reduce{background:var(--danger)}
.edit{background:#455a64}
.delete{background:#000}
.whatsapp{
  display:inline-block;
  margin-top:6px;
  padding:6px 10px;
  background:#25D366;
  color:#fff;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* RESPONSIVE */
@media (max-width: 768px){
  .mobileHeader{
    display:flex;
  }

  .app{
    flex-direction:column;
    height:auto;
  }

  .sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:260px;
    height:100vh;
    z-index:1000;
    transition:0.3s;
  }

  .sidebar.show{
    left:0;
  }

  .main{
    width:100%;
    padding:15px;
    margin-left:0;
  }
}
body::after{
  content: "© Anirudh Balaji S/O Venkatesh";
  position: fixed;
  bottom: 10px;
  right: 10px;
  font-size: 11px;
  color: rgba(0,0,0,0.15);
  pointer-events: none;
  z-index: 0;
}
body.dark::after{
  color: rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="https://i.ibb.co/bMRdkgPb/Screenshot-20251219-121943.jpg">
  <h1>Balaji Motors – Anavatti</h1>
  <small>Bajaj Authorised Service Center</small>
</div>

<div class="mobileHeader">
  <button onclick="toggleSidebar()">☰</button>
  <b>Balaji Motors</b>
</div>

<div class="app" id="app" style="display:none">

  <div class="sidebar">
    <h2>Balaji<br>Motors</h2>
    <button onclick="nav(dashboard)">🏠 Dashboard</button>
    <button onclick="nav(stockView)">📦 Stock</button>
    <button onclick="nav(monthlyCustomers)">📅 Monthly Customers</button>
    <button onclick="nav(searchView)">🔍 Search</button>
    <button onclick="nav(generateTodayBill)">🧾 Invoice / Bill</button>
    <button onclick="exportData()"
      class="adv">📤 Export</button>
    <button onclick="importData()"
      class="adv">📥 Import</button>
    <button onclick="toggleTheme()">🌙 Theme</button>
    <button onclick="nav(historyView)">📜 History</button>
    <button onclick="nav(lowStockView)">⚠️ Low Stock</button>
    <button onclick="logout()">🚪 Logout</button>
    <button onclick="nav(revenueView)"
      class="adv">💰 Revenue</button>
    <button onclick="nav(savedBillsView)"
      class="adv">🧾 Saved Bills</button>
    <button id="changePinBtn" onclick="changePin()"
      class="adv">🔐 Change PIN</button>
    <button onclick="nav(cloudSave)"
      class="adv">☁️ Cloud Save</button>
    <button onclick="nav(cloudLoad)"
      class="adv">☁️ Cloud Load</button>
  </div>

  <div class="main" id="main"></div>
</div>

<input type="file" id="fileInput" hidden>

<script>
  let currentBill = {};
  if(!localStorage.billNo)
    localStorage.billNo = "1";
/* SPLASH */
setTimeout(()=>{
  splash.style.display="none";
  app.style.display="flex";
  login();
},2500);

/* THEME */
if(localStorage.theme==="dark") document.body.classList.add("dark");
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.theme=document.body.classList.contains("dark")?"dark":"light";
}

/* SIDEBAR */
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("show");
}
function nav(fn){
  fn();
  if(innerWidth<=768) document.querySelector(".sidebar").classList.remove("show");
}

/* SECURITY */
if(!localStorage.ownerPin) localStorage.ownerPin="2580";
if(!localStorage.staffPin) localStorage.staffPin="1111";
let role="owner";
let mode = "advanced";

function login(){
  let p = prompt("Enter PIN");
  if(p === localStorage.ownerPin){
  role = "owner";
  mode = "advanced";
}
else if(p === localStorage.staffPin){
  role = "staff";
  mode = "simple";
}
  else { alert("Wrong PIN"); return login(); }

  // Hide Change PIN button for staff
  setTimeout(()=>{
    let btn = document.getElementById("changePinBtn");
    if(btn && role !== "owner"){
      btn.style.display = "none";
    }
  }, 0);
  applyModeUI();
  dashboard();
}

/* DATA */
let meta = JSON.parse(localStorage.meta || "{}");
let stock=JSON.parse(localStorage.stock||"{}");
let history=JSON.parse(localStorage.history||"[]");
let bills = JSON.parse(localStorage.bills || "[]");
let customers = JSON.parse(localStorage.customers || "{}");
if(!localStorage.invoiceNo) localStorage.invoiceNo="1";
let selectedLabour = 0;
/* DASHBOARD */
function dashboard(){
  let d=new Date(),m=d.getMonth(),y=d.getFullYear();
  let list=history.filter(x=>{
    let t=new Date(x.time);
    return t.getMonth()==m&&t.getFullYear()==y;
  });
  let cust=new Set(list.map(x=>x.phone));
  main.innerHTML = `
  <div class="card">
    <h2>Balaji Motors – Anavatti</h2>
    <p>Bajaj Authorised Service Center</p>
  </div>

  <div class="card">
    <h3>${d.toLocaleString("default",{month:"long"})} ${y}</h3>
    Total Services: ${list.length}<br>
    Customers: ${cust.size}<br>
    Last Service: ${list[0]?.time||"—"}
  </div>

  <div class="card">
  <small>
    © Balaji Motors – Anavatti<br>
    Bajaj Authorised Service Center
  </small>
</div>
`;
  checkBackupReminder();
}

/* STOCK */
function stockView(){
  let h = `
  <div class="card">
    <input type="text" id="stockSearch" placeholder="Search spare..." 
      onkeyup="filterStock()" style="width:100%;padding:10px;font-size:16px;">
  </div>
`;
  if(role==="owner") h+=`<button onclick="addStock()">➕ Add Stock</button>`;
  h+=`</div>`;
  for(let i in stock){
    let low=stock[i].qty<=5?'<span class="low"> LOW</span>':'';
    h+=`
    <div class="card stockItem" data-name="${i.toLowerCase()}">
      <b>${i}</b><br>
      Qty: ${stock[i].qty}${low}
      <div class="btnRow">
        <button class="reduce ${role==='staff'?'big-btn':''}" onclick="useStock('${i}')">
  Reduce
</button>
        ${role==="owner"?`
        <button class="edit" onclick="editStock('${i}')">Edit</button>
        <button class="delete" onclick="delStock('${i}')">Delete</button>
        onclick="delStock('${i}')">Delete</button>`:""}
      </div>
    </div>`;
  }
  if(!Object.keys(stock).length) h+=`<div class="card">No stock</div>`;
  main.innerHTML=h;
  localStorage.stock=JSON.stringify(stock);
}


function addStock(){
  let n=prompt("Spare name"),q=+prompt("Qty"),c=+prompt("Cost");
  if(!n||q<0) return;
  let price = +prompt("Selling price (GST included)");
stock[n] = { qty: q, cost: c, price: price };
  stockView();
}
function editStock(i){
  let q=+prompt("Qty"); if(q<0) return;
  stock[i].qty=q;
  stockView();
}
function delStock(i){
  if(confirm("Delete?")){delete stock[i];stockView();}
}
function useStock(i){
  let q = +prompt("Quantity used:");
  let phone = prompt("Phone (10 digits):");
  if(!/^\d{10}$/.test(phone)) return alert("Invalid phone");

  let cust = customers[phone]?.name || prompt("Customer name:");
  let vehicle = customers[phone]?.vehicle || prompt("Vehicle number:");
  let staff = prompt("Staff name:");
  // 🔹 Save / update customer profile
if(!customers[phone]){
  customers[phone] = {
    name: cust,
    vehicle: vehicle,
    visits: 1
  };
} else {
  customers[phone].visits++;
  customers[phone].vehicle = vehicle; // update latest vehicle
}

localStorage.customers = JSON.stringify(customers);

  if(
    !cust || 
    !vehicle || 
    !staff || 
    !/^\d{10}$/.test(phone) || 
    stock[i].qty < q
  ){
    alert("Invalid input");
    return;
  }

  stock[i].qty -= q;

  let time = new Date().toLocaleString();

  history.unshift({
    cust,
    phone,
    vehicle,
    item: i,
    qty: q,
    staff,
    time
  });

  localStorage.history = JSON.stringify(history);
  localStorage.stock = JSON.stringify(stock);

  let msg =
`Hello ${cust},
Dear Sir/Madam ,

Your vehicle ${vehicle} service is completed at
Balaji Motors, Anavatti.

🛠️ Service Date: ${time}
👨‍🔧 Serviced by: ${staff}

Thank you for visiting Bajaj Authorised Service.`;

  main.innerHTML = `
    <div class="card">
      <h3>Service Saved</h3>
      <p><b>Customer:</b> ${cust}</p>
      <p><b>Vehicle:</b> ${vehicle}</p>
      <p><b>Staff:</b> ${staff}</p>
      <p><b>Date:</b> ${time}</p>

      <a class="whatsapp"
         href="https://wa.me/91${phone}?text=${encodeURIComponent(msg)}"
         target="_blank">
         📲 Send WhatsApp Message
      </a>

      <br><br>
      <button onclick="stockView()">⬅ Back to Stock</button>
    </div>
  `;
}
function logout(){
  location.reload();
}
//Revenue view
function revenueView(){
  let today = new Date();
  let todayStr = today.toDateString();

  let dailyTotal = 0;
  let monthlyTotal = 0;

  bills.forEach(b=>{
    let d = new Date(b.date);

    // Daily
    if(d.toDateString() === todayStr){
      dailyTotal += b.total;
    }

    // Monthly
    if(
      d.getMonth() === today.getMonth() &&
      d.getFullYear() === today.getFullYear()
    ){
      monthlyTotal += b.total;
    }
  });

  main.innerHTML = `
    <div class="card">
      <h3>Revenue Summary</h3>
      <p><b>Today:</b> ₹${dailyTotal}</p>
      <p><b>This Month:</b> ₹${monthlyTotal}</p>
    </div>
  `;
}

/* MONTHLY */
function monthlyCustomers(){
  let y=+prompt("Year"),m=+prompt("Month (1-12)")-1;
  let list=history.filter(x=>{
    let d=new Date(x.time);
    return d.getFullYear()==y&&d.getMonth()==m;
  });
  if(!list.length){main.innerHTML=`<div class="card">No data</div>`;return;}
  let h=`<div class="card"><h3>${m+1}/${y}</h3></div>`;
  list.forEach(x=>{
    h+=`<div class="card">${x.cust} (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;
  });
  main.innerHTML=h;
}

/* SEARCH */
function searchView(){
  let q=prompt("Customer name / Vehicle");
  let list=history.filter(x=>
    x.cust.toLowerCase().startsWith(q.toLowerCase()) ||
    x.vehicle.toLowerCase().includes(q.toLowerCase())
  );
  if(!list.length){main.innerHTML=`<div class="card">No record</div>`;return;}
  let h=`<div class="card"><h3>Results</h3></div>`;
 let repeatTag = customers[x.phone]?.visits > 1
  ? " ⭐ Repeat Customer"
  : "";

h += `
  <div class="card">
    <b>${x.cust}</b>${repeatTag}<br>
    Phone: ${x.phone}<br>
    Vehicle: ${x.vehicle}<br>
    Visits: ${customers[x.phone]?.visits || 1}<br>
    Last Service: ${x.time}
  </div>
`;
  main.innerHTML=h;
}

/* INVOICE */
function invoiceView(){
  let no=localStorage.invoiceNo.padStart(4,"0");
  localStorage.invoiceNo=+localStorage.invoiceNo+1+"";
  let total=0;
  history.slice(0,5).forEach(x=>{
    total+=x.qty*(stock[x.item]?.cost||0);
  });
  let gst=total*0.18;
  main.innerHTML=`
  <div class="card">
    Invoice No: BM-${no}<br>
    Total: ₹${total}<br>
    GST (18%): ₹${gst}<br>
    <b>Grand: ₹${total+gst}</b>
  </div>`;
}

/* HISTORY */
function historyView(){
  if(!history.length){main.innerHTML=`<div class="card">No history</div>`;return;}
  let h=`<div class="card"><h3>History</h3></div>`;
  history.forEach(x=>{let repeat =
  customers[x.phone]?.visits > 1
    ? " ⭐ Repeat"
    : "";
    h+=`<div class="card"><b>${x.cust}</b>${repeat}<br> (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;
  });
  main.innerHTML=h;
}

/* EXPORT / IMPORT */
function exportData(){
  meta.lastBackup = new Date().toISOString();
localStorage.meta = JSON.stringify(meta);
  let b=new Blob([JSON.stringify({stock,history},null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="balaji-motors-backup.json";
  a.click();
}
function importData(){
  fileInput.click();
}
fileInput.onchange=e=>{
  let r=new FileReader();
  r.onload=ev=>{
    let d=JSON.parse(ev.target.result);
    stock=d.stock||{};
    history=d.history||[];
    localStorage.stock=JSON.stringify(stock);
    localStorage.history=JSON.stringify(history);
    dashboard();
  };
  r.readAsText(e.target.files[0]);
};

/* PIN CHANGE */
function changePin(){
  if(role !== "owner"){
    alert("Access denied");
    return;
  }

  let newPin = prompt("Enter NEW Owner PIN");
  if(!newPin || newPin.length < 4){
    alert("Invalid PIN");
    return;
  }

  localStorage.ownerPin = newPin;
  alert("Owner PIN updated successfully");
}
/*SAVED BILLS*/
function savedBillsView(){
  if(!bills.length){
    main.innerHTML = `<div class="card">No bills available</div>`;
    return;
  }

  let h = `<div class="card"><h3>Saved Bills</h3></div>`;

  bills.forEach((b, index)=>{
    h += `
      <div class="card">
        <b>${b.billNo}</b><br>
        Phone: ${b.phone}<br>
        Vehicle: ${b.vehicle}<br>
        Date: ${new Date(b.date).toLocaleString()}<br>
        Total: ₹${b.total}<br><br>
        <button onclick="reprintBill(${index})">🖨 Reprint</button>
      </div>
    `;
  });

  main.innerHTML = h;
}
function reprintBill(index){
  let b = bills[index];

  let rows = "";
  b.items.forEach(i=>{
    let price = stock[i.item]?.price || 0;
    let amount = price * i.qty;

    rows += `
      <tr>
        <td>${i.item}</td>
        <td>${i.qty}</td>
        <td>₹${amount}</td>
      </tr>
    `;
  });

  if(b.labour > 0){
    rows += `
      <tr>
        <td>Labour</td>
        <td>—</td>
        <td>₹${b.labour}</td>
      </tr>
    `;
  }

  main.innerHTML = `
    <div class="card" id="billArea">
      <h2>Balaji Motors – Anavatti</h2>
      <p><b>Bill No:</b> ${b.billNo}</p>
      <p><b>Date:</b> ${new Date(b.date).toLocaleString()}</p>
      <hr>

      <table width="100%" border="1" cellspacing="0" cellpadding="6">
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
        ${rows}
      </table>

      <h3>Total Amount: ₹${b.total}</h3>

      <button onclick="window.print()">🖨 Print</button>
      <button onclick="savedBillsView()">⬅ Back</button>
    </div>
  `;
}
function generateTodayBill(){
  selectedLabour = 0;
  let phone = prompt("Customer phone number:");
  let vehicle = prompt("Vehicle number:");

  if(!phone || !vehicle){
    alert("Details required");
    return;
  }

  // ✅ USE invoiceNo ONLY
  let billNo = "BM-" + localStorage.invoiceNo.padStart(4,"0");

  let today = new Date().toDateString();

  let items = history.filter(h =>
    h.phone === phone &&
    h.vehicle === vehicle &&
    new Date(h.time).toDateString() === today
  );

  if(items.length === 0){
    alert("No service found for today");
    return;
  }
  let labour = selectedLabour;
  let total = labour;
  let rows = "";

  items.forEach(i=>{
    let price = stock[i.item]?.price || 0;
    let amount = price * i.qty;
    total += amount;

    rows += `
      <tr>
        <td>${i.item}</td>
        <td>${i.qty}</td>
        <td>₹${amount}</td>
      </tr>`;
  });

  if(labour > 0){
    rows += `
      <tr>
        <td>Labour Charge</td>
        <td>—</td>
        <td>₹${labour}</td>// 🔹 Save bill for future reprint </tr>`;
    currentBill = {
  billNo: billNo,
  phone: phone,
  vehicle: vehicle,
  items: items.map(i => ({
    item: i.item,
    qty: i.qty
  })),
  labour: labour,
  total: total
};
  }
  
  main.innerHTML = `<div class="card">
  <h3>Labour Charges</h3>

  <button onclick="setLabour(150)">₹150</button>
  <button onclick="setLabour(300)">₹300</button>
  <button onclick="setLabour(500)">₹500</button>

  <br><br>

  Custom:
  <input type="number" id="customLabour" placeholder="Enter amount">
  <button onclick="setCustomLabour()">Apply</button>

  <p>
    <b>Selected Labour:</b> ₹
    <span id="labourValue">0</span>
  </p>
</div>
    <div class="card" id="billArea">
      <h2>Balaji Motors – Anavatti</h2>
      <p><b>Bill No:</b> ${billNo}</p>
      <p>Bajaj Authorised Service</p>
      <hr>

      <p>
        <b>Phone:</b> ${phone}<br>
        <b>Vehicle:</b> ${vehicle}<br>
        <b>Date:</b> ${today}
      </p>

      <table width="100%" border="1" cellspacing="0" cellpadding="6">
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
        ${rows}
      </table>

      <h3>Total Amount: ₹${total}</h3>
      <p>(GST included in price)</p>

      <button onclick="printBill()">🖨 Print Bill</button>
      <button onclick="dashboard()">⬅ Back</button>
    </div>
  `;

  // ✅ increment SAME counter
  localStorage.invoiceNo = (+localStorage.invoiceNo + 1).toString();
}

function printBill(){

  // 🔹 SAVE BILL ONLY WHEN PRINTING
  bills.unshift({
    billNo: document.querySelector("#billArea b").innerText.replace("Bill No: ",""),
    phone: currentBill.phone,
    vehicle: currentBill.vehicle,
    date: new Date().toISOString(),
    items: currentBill.items,
    labour: currentBill.labour,
    total: currentBill.total
  });

  localStorage.bills = JSON.stringify(bills);

  window.print();
}
function lowStockView(){
  let h = `<div class="card"><h3>Low Stock Items</h3></div>`;
  let found = false;

  for(let item in stock){
    if(stock[item].qty <= 5){
      found = true;
      h += `
        <div class="card">
          <b>${item}</b><br>
          Quantity Left: <span class="low">${stock[item].qty}</span>
        </div>
      `;
    }
  }

  if(!found){
    h += `<div class="card">✅ No low stock items</div>`;
  }

  main.innerHTML = h;
}
function setLabour(amount){
  selectedLabour = amount;
  document.getElementById("labourValue").innerText = amount;
}

function setCustomLabour(){
  let val = +document.getElementById("customLabour").value || 0;
  selectedLabour = val;
  document.getElementById("labourValue").innerText = val;
}
function checkBackupReminder(){
  if(!meta.lastBackup) return;

  let last = new Date(meta.lastBackup);
  let now = new Date();

  let diffDays = Math.floor(
    (now - last) / (1000 * 60 * 60 * 24)
  );

  if(diffDays >= 7){
    alert("⚠️ Last backup was " + diffDays + " days ago. Please export backup.");
  }
}
function applyModeUI(){

  // 🔹 Reset: show all advanced buttons first
  document.querySelectorAll(".adv").forEach(btn=>{
    btn.style.display = "block";
  });

  // 🔹 Hide advanced buttons for staff
  if(mode === "simple"){
    document.querySelectorAll(".adv").forEach(btn=>{
      btn.style.display = "none";
    });
  }
}
function filterStock(){
  let q = document.getElementById("stockSearch").value.toLowerCase();
  document.querySelectorAll(".stockItem").forEach(card=>{
    let name = card.getAttribute("data-name");
    card.style.display = name.includes(q) ? "block" : "none";
  });
}
async function cloudSave(){
  await db.collection("balaji").doc("data").set({
    stock, history, bills, customers, meta
  });
  alert("☁️ Cloud backup saved");
}

async function cloudLoad(){
  let doc = await db.collection("balaji").doc("data").get();
  if(!doc.exists){
    alert("No cloud data found");
    return;
  }

  let d = doc.data();
  stock = d.stock || {};
  history = d.history || [];
  bills = d.bills || [];
  customers = d.customers || {};
  meta = d.meta || {};

  localStorage.stock = JSON.stringify(stock);
  localStorage.history = JSON.stringify(history);
  localStorage.bills = JSON.stringify(bills);
  localStorage.customers = JSON.stringify(customers);
  localStorage.meta = JSON.stringify(meta);

  alert("☁️ Cloud data loaded");
  dashboard();
}
</script>
