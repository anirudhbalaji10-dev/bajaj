<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDORVDe8uzAbCPWVDKc44YZbMKBTlRO6tU",
  authDomain: "balaji-motors-6fe53.firebaseapp.com",
  projectId: "balaji-motors-6fe53",
  storageBucket: "balaji-motors-6fe53.firebasestorage.app",
  messagingSenderId: "713173253840",
  appId: "1:713173253840:web:8bad1c0d1f9c8b9333a8d5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.currentUID = "";
window.role = "staff";
window.stock = {};
window.serviceHistory = [];
window.bills = [];
window.customers = {};
window.meta = {};
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {

  const loginBox = document.getElementById("loginBox");
  const appBox   = document.getElementById("app");
  if(!loginBox || !appBox) return;

  if(!user){
    loginBox.style.display = "block";
    appBox.style.display = "none";
    return;
  }

  window.currentUID = user.uid;
  localStorage.currentUID = window.currentUID;

  setTimeout(async () => {
    try{
      window.role = await getUserRole(window.currentUID);

      const loginBox = document.getElementById("loginBox");
      const appBox   = document.getElementById("app");

      if(loginBox && appBox){
        loginBox.style.display = "none";
        appBox.style.display = "flex";
      }

      const data = await cloudLoad();
      if(data){
        stock = data.stock || {};
        serviceHistory = data.serviceHistory || [];
        bills = data.bills || [];
        customers = data.customers || {};
        meta = data.meta || {};
      }

      dashboard();
    }
    catch(err){
      alert("Login error: " + err);
      console.error(err);
    }
  }, 300);
});

window.db = db;
window.fbSetDoc = setDoc;
window.fbDoc = doc;

window.firebaseLogin = (email, pass) =>
  signInWithEmailAndPassword(auth, email, pass);
window.firebaseSignup = async (email, pass) => {
  const userCred = await createUserWithEmailAndPassword(auth, email, pass);
  const uid = userCred.user.uid;

  const adminSnap = await getDoc(doc(db,"system","owner"));

  let role = "staff";
  if(!adminSnap.exists()){
    role = "owner";
    await setDoc(doc(db,"system","owner"), { uid });
  }

  await setDoc(doc(db, "users", uid), { role });

  return userCred;
};


window.getUserRole = async (uid) => {
  let attempts = 0;
  while(attempts < 10){
    const snap = await getDoc(doc(db, "users", uid));
    if(snap.exists()) return snap.data().role;
    await new Promise(r=>setTimeout(r,300));
    attempts++;
  }
  throw "ROLE_NOT_READY";
};


window.cloudSave = async (data) => {
  if(!window.currentUID) return;
  try{
    await setDoc(doc(db,"users",window.currentUID, "app","data"), data);
  }catch(e){
    console.error("Cloud save failed", e);
  }
};

window.cloudLoad = async () => {
  if(!window.currentUID) return null;
  const snap = await getDoc(doc(db,"users", window.currentUID, "app","data"));
  return snap.exists() ? snap.data() : null;
};
document.addEventListener("DOMContentLoaded", () => {
  
 document.getElementById("loginBtn").addEventListener("click", async () => {
   const email = document.getElementById("email").value;
   const pass  = document.getElementById("password").value;
   try {
     await signInWithEmailAndPassword(auth, email, pass);
   } catch(e){
     alert(e.message);
   }
 });

  document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;

  if(!email || !pass){
    alert("Enter email and password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    if(e.code === "auth/user-not-found")
      alert("Account not found. Please create account first.");
    else if(e.code === "auth/wrong-password")
      alert("Incorrect password.");
    else
      alert(e.message);
  }
});

  
});

window.logout = async function(){
  await auth.signOut();
  localStorage.clear();
  location.reload();
};


</script>

<script>

let selectedLabour = 0;

/* STOCK */
function stockView(){
  let h = `
  <div class="card">
    <input type="text" id="stockSearch" placeholder="Search spare..." 
      onkeyup="filterStock()" style="width:100%;padding:10px;font-size:16px;">
  </div>
`;
  if(role==="owner") h+=`<button onclick="addStock()">➕ Add Stock</button>`;
  h+=`</div>`;
  for(let i in stock){
    let low=stock[i].qty<=5?'<span class="low"> LOW</span>':'';
    h+=`
    <div class="card stockItem" data-name="${i.toLowerCase()}">
      <b>${i}</b><br>
      Qty: ${stock[i].qty}${low}
      <div class="btnRow">
        <button class="reduce ${role==='staff'?'big-btn':''}" onclick="useStock('${i}')">
  Reduce
</button>
        ${role==="owner"?`
        <button class="edit" onclick="editStock('${i}')">Edit</button>
        <button class="delete" onclick="delStock('${i}')">Delete</button>
        `:""}
      </div>
    </div>`;
  }
  if(!Object.keys(stock).length) h+=`<div class="card">No stock</div>`;
  main.innerHTML=h;
  localStorage.stock=JSON.stringify(stock);
}


function addStock(){
  let n=prompt("Spare name"),q=+prompt("Qty"),c=+prompt("Cost");
  if(!n||q<0) return;
  let price = +prompt("Selling price (GST included)");
stock[n] = { qty: q, cost: c, price: price };
  stockView();
  cloudSave({ stock, serviceHistory, bills, customers, meta });
}
function editStock(i){
  let q=+prompt("Qty"); if(q<0) return;
  stock[i].qty=q;
  stockView();
  cloudSave({ stock, serviceHistory, bills, customers, meta });
}
function delStock(i){
  if(confirm("Delete?")){delete stock[i];stockView();cloudSave({ stock, serviceHistory, bills, customers, meta });}
}
function useStock(i){
  let q = +prompt("Quantity used:");
  let phone = prompt("Phone (10 digits):");
  if(!/^\d{10}$/.test(phone)) return alert("Invalid phone");

  let cust = customers[phone]?.name || prompt("Customer name:");
  let vehicle = customers[phone]?.vehicle || prompt("Vehicle number:");
  let staff = prompt("Staff name:");
  // 🔹 Save / update customer profile
if(!customers[phone]){
  customers[phone] = {
    name: cust,
    vehicle: vehicle,
    visits: 1
  };
} else {
  customers[phone].visits++;
  customers[phone].vehicle = vehicle; // update latest vehicle
}

localStorage.customers = JSON.stringify(customers);

  if(
    !cust || 
    !vehicle || 
    !staff || 
    !/^\d{10}$/.test(phone) || 
    stock[i].qty < q
  ){
    alert("Invalid input");
    return;
  }

  stock[i].qty -= q;

  let time = new Date().toLocaleString();

  serviceHistory.unshift({
    cust,
    phone,
    vehicle,
    item: i,
    qty: q,
    staff,
    time
  });

  localStorage.serviceHistory = JSON.stringify(serviceHistory);
  localStorage.stock = JSON.stringify(stock);
  cloudSave({ stock, serviceHistory, bills, customers, meta });

  let msg =
`Hello ${cust},
Dear Sir/Madam ,

Your vehicle ${vehicle} service is completed at
Balaji Motors, Anavatti.

🛠️ Service Date: ${time}
👨‍🔧 Serviced by: ${staff}

Thank you for visiting Bajaj Authorised Service.`;

  main.innerHTML = `
    <div class="card">
      <h3>Service Saved</h3>
      <p><b>Customer:</b> ${cust}</p>
      <p><b>Vehicle:</b> ${vehicle}</p>
      <p><b>Staff:</b> ${staff}</p>
      <p><b>Date:</b> ${time}</p>

      <a class="whatsapp"
         href="https://wa.me/91${phone}?text=${encodeURIComponent(msg)}"
         target="_blank">
         📲 Send WhatsApp Message
      </a>

      <br><br>
      <button onclick="stockView()">⬅ Back to Stock</button>
    </div>
  `;
}
//Revenue view
function revenueView(){
  let today = new Date();
  let todayStr = today.toDateString();

  let dailyTotal = 0;
  let monthlyTotal = 0;

  bills.forEach(b=>{
    let d = new Date(b.date);

    // Daily
    if(d.toDateString() === todayStr){
      dailyTotal += b.total;
    }

    // Monthly
    if(
      d.getMonth() === today.getMonth() &&
      d.getFullYear() === today.getFullYear()
    ){
      monthlyTotal += b.total;
    }
  });

  main.innerHTML = `
    <div class="card">
      <h3>Revenue Summary</h3>
      <p><b>Today:</b> ₹${dailyTotal}</p>
      <p><b>This Month:</b> ₹${monthlyTotal}</p>
    </div>
  `;
}

/* MONTHLY */
function monthlyCustomers(){
  let y=+prompt("Year"),m=+prompt("Month (1-12)")-1;
  let list=serviceHistory.filter(x=>{
    let d=new Date(x.time);
    return d.getFullYear()==y&&d.getMonth()==m;
  });
  if(!list.length){main.innerHTML=`<div class="card">No data</div>`;return;}
  let h=`<div class="card"><h3>${m+1}/${y}</h3></div>`;
  list.forEach(x=>{
    h+=`<div class="card">${x.cust} (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;
  });
  main.innerHTML=h;
}

/* SEARCH */
function searchView(){
  let q = prompt("Customer name / Vehicle");
  if(!q) return;

  let list = serviceHistory.filter(x =>
    x.cust.toLowerCase().startsWith(q.toLowerCase()) ||
    x.vehicle.toLowerCase().includes(q.toLowerCase())
  );

  if(!list.length){
    main.innerHTML = `<div class="card">No record</div>`;
    return;
  }

  let h = `<div class="card"><h3>Results</h3></div>`;

  list.forEach(x=>{
    let repeatTag = customers[x.phone]?.visits > 1 ? " ⭐ Repeat Customer" : "";
    h += `
      <div class="card">
        <b>${x.cust}</b>${repeatTag}<br>
        Phone: ${x.phone}<br>
        Vehicle: ${x.vehicle}<br>
        Last Service: ${x.time}
      </div>
    `;
  });

  main.innerHTML = h;
}


/* INVOICE */
function invoiceView(){
  let no=localStorage.invoiceNo.padStart(4,"0");
  localStorage.invoiceNo=+localStorage.invoiceNo+1+"";
  let total=0;
  serviceHistory.slice(0,5).forEach(x=>{
    total+=x.qty*(stock[x.item]?.cost||0);
  });
  let gst=total*0.18;
  main.innerHTML=`
  <div class="card">
    Invoice No: BM-${no}<br>
    Total: ₹${total}<br>
    GST (18%): ₹${gst}<br>
    <b>Grand: ₹${total+gst}</b>
  </div>`;
}

  if(!serviceHistory.length){main.innerHTML=`<div class="card">No serviceHistory</div>`;return;}
  let h=`<div class="card"><h3>serviceHistory</h3></div>`;
  serviceHistory.forEach(x=>{let repeat =
  customers[x.phone]?.visits > 1

    h+=`<div class="card"><b>${x.cust}</b>${repeat}<br> (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;

/* EXPORT / IMPORT */
function exportData(){
  meta.lastBackup = new Date().toISOString();
localStorage.meta = JSON.stringify(meta);
  let b=new Blob([JSON.stringify({stock,serviceHistory},null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="balaji-motors-backup.json";
  a.click();
}
function importData(){
  if(!fileInput){ alert("File system not ready"); return; }
  fileInput.click();
}

fileInput.onchange=e=>{
  let r=new FileReader();
  r.onload=ev=>{
    let d=JSON.parse(ev.target.result);
    stock=d.stock||{};
    serviceHistory=d.serviceHistory||[];
    localStorage.stock=JSON.stringify(stock);
    localStorage.serviceHistory=JSON.stringify(serviceHistory);
    dashboard();
    cloudSave({ stock, serviceHistory, bills, customers, meta });
  };
  r.readAsText(e.target.files[0]);
};

    alert("Access denied");

  }

  let newPin = prompt("Enter NEW Owner PIN");
  if(!newPin || newPin.length < 4){
    alert("Invalid PIN");
    return;

  localStorage.ownerPin = newPin;
  alert("Owner PIN updated successfully");
}
/*SAVED BILLS*/
function savedBillsView(){
  if(!bills.length){
    main.innerHTML = `<div class="card">No bills available</div>`;
    return;
  }

  let h = `<div class="card"><h3>Saved Bills</h3></div>`;

  bills.forEach((b, index)=>{
    h += `
      <div class="card">
        <b>${b.billNo}</b><br>
        Phone: ${b.phone}<br>
        Vehicle: ${b.vehicle}<br>
        Date: ${new Date(b.date).toLocaleString()}<br>
        Total: ₹${b.total}<br><br>
        <button onclick="reprintBill(${index})">🖨 Reprint</button>
      </div>
    `;
  });

  main.innerHTML = h;
}
function reprintBill(index){
  let b = bills[index];

  let rows = "";
  b.items.forEach(i=>{
    let price = stock[i.item]?.price || 0;
    let amount = price * i.qty;

    rows += `
      <tr>
        <td>${i.item}</td>
        <td>${i.qty}</td>
        <td>₹${amount}</td>
      </tr>
    `;
  });

  if(b.labour > 0){
    rows += `
      <tr>
        <td>Labour</td>
        <td>—</td>
        <td>₹${b.labour}</td>
      </tr>
    `;
  }

  main.innerHTML = `
    <div class="card" id="billArea">
      <h2>Balaji Motors – Anavatti</h2>
      <p><b>Bill No:</b> ${b.billNo}</p>
      <p><b>Date:</b> ${new Date(b.date).toLocaleString()}</p>
      <hr>

      <table width="100%" border="1" cellspacing="0" cellpadding="6">
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
        ${rows}
      </table>

      <h3>Total Amount: ₹${b.total}</h3>

      <button onclick="window.print()">🖨 Print</button>
      <button onclick="savedBillsView()">⬅ Back</button>
    </div>
  `;
}
function generateTodayBill(){
  selectedLabour = 0;
  let phone = prompt("Customer phone number:");
  let vehicle = prompt("Vehicle number:");

  if(!phone || !vehicle){
    alert("Details required");
    return;
  }

  // ✅ USE invoiceNo ONLY
  let billNo = "BM-" + localStorage.invoiceNo.padStart(4,"0");

  let today = new Date().toDateString();

  let items = serviceHistory.filter(h =>
    h.phone === phone &&
    h.vehicle === vehicle &&
    new Date(h.time).toDateString() === today
  );

  if(items.length === 0){
    alert("No service found for today");
    return;
  }
  let labour = selectedLabour;
  let total = labour;
  let rows = "";

  items.forEach(i=>{
    let price = stock[i.item]?.price || 0;
    let amount = price * i.qty;
    total += amount;

    rows += `
      <tr>
        <td>${i.item}</td>
        <td>${i.qty}</td>
        <td>₹${amount}</td>
      </tr>`;
  });

  if(labour > 0){
  rows += `
      <tr>
        <td>Labour Charge</td>
        <td>—</td>
        <td>₹${labour}</td>
      </tr>`;
}

currentBill = {
  billNo: billNo,
  phone: phone,
  vehicle: vehicle,
  items: items.map(i => ({
    item: i.item,
    qty: i.qty
  })),
  labour: labour,
  total: total
};

  
  main.innerHTML = `<div class="card">
  <h3>Labour Charges</h3>

  <button onclick="setLabour(150)">₹150</button>
  <button onclick="setLabour(300)">₹300</button>
  <button onclick="setLabour(500)">₹500</button>

  <br><br>

  Custom:
  <input type="number" id="customLabour" placeholder="Enter amount">
  <button onclick="setCustomLabour()">Apply</button>

  <p>
    <b>Selected Labour:</b> ₹
    <span id="labourValue">0</span>
  </p>
</div>
    <div class="card" id="billArea">
      <h2>Balaji Motors – Anavatti</h2>
      <p><b>Bill No:</b> ${billNo}</p>
      <p>Bajaj Authorised Service</p>
      <hr>

      <p>
        <b>Phone:</b> ${phone}<br>
        <b>Vehicle:</b> ${vehicle}<br>
        <b>Date:</b> ${today}
      </p>

      <table width="100%" border="1" cellspacing="0" cellpadding="6">
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Amount</th>
        </tr>
        ${rows}
      </table>

      <h3>Total Amount: ₹${total}</h3>
      <p>(GST included in price)</p>

      <button onclick="printBill()">🖨 Print Bill</button>
      <button onclick="dashboard()">⬅ Back</button>
    </div>
  `;

  // ✅ increment SAME counter
  localStorage.invoiceNo = (+localStorage.invoiceNo + 1).toString();
}

function printBill(){
  if(!currentBill || !currentBill.phone){
  alert("Please generate bill first");
  return;
}

  // 🔹 SAVE BILL ONLY WHEN PRINTING
  bills.unshift({
    billNo: document.querySelector("#billArea b").innerText.replace("Bill No: ",""),
    phone: currentBill.phone,
    vehicle: currentBill.vehicle,
    date: new Date().toISOString(),
    items: currentBill.items,
    labour: currentBill.labour,
    total: currentBill.total
  });

  localStorage.bills = JSON.stringify(bills);
  cloudSave({ stock, serviceHistory, bills, customers, meta });

  window.print();
}
function lowStockView(){
  let h = `<div class="card"><h3>Low Stock Items</h3></div>`;
  let found = false;

  for(let item in stock){
    if(stock[item].qty <= 5){
      found = true;
      h += `
        <div class="card">
          <b>${item}</b><br>
          Quantity Left: <span class="low">${stock[item].qty}</span>
        </div>
      `;
    }
  }

  if(!found){
    h += `<div class="card">✅ No low stock items</div>`;
  }

  main.innerHTML = h;
}
function setLabour(amount){
  selectedLabour = amount;
  document.getElementById("labourValue").innerText = amount;
}

function setCustomLabour(){
  let val = +document.getElementById("customLabour").value || 0;
  selectedLabour = val;
  document.getElementById("labourValue").innerText = val;
}
function checkBackupReminder(){
  if(!meta.lastBackup) return;

  let last = new Date(meta.lastBackup);
  let now = new Date();

  let diffDays = Math.floor(
    (now - last) / (1000 * 60 * 60 * 24)
  );

  if(diffDays >= 7){
    alert("⚠️ Last backup was " + diffDays + " days ago. Please export backup.");
  }
}

function filterStock(){
  let q = document.getElementById("stockSearch").value.toLowerCase();
  document.querySelectorAll(".stockItem").forEach(card=>{
    let name = card.getAttribute("data-name");
    card.style.display = name.includes(q) ? "block" : "none";
  });
}
