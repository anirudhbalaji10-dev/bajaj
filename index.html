<style>
.big-btn {
  padding: 16px !important;
  font-size: 18px !important;
  border-radius: 10px;
}
:root{
  --blue:#0a2e5c;
  --bg:#f2f5f9;
  --card:#ffffff;
  --text:#000;
  --danger:#c62828;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
}

/* SPLASH */
#splash{
  position:fixed;inset:0;
  background:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{width:160px}
#splash h2{color:var(--blue);margin:10px 0 0}
#splash small{letter-spacing:1px}

/* MOBILE HEADER */
.mobileHeader{
  display:none;
  background:var(--blue);
  color:#fff;
  padding:10px;
  align-items:center;
  gap:10px;
}
.mobileHeader button{
  background:none;border:none;color:#fff;font-size:22px;
}

/* LAYOUT */
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:var(--blue);
  color:#fff;
  padding:15px;
  min-height:100vh;
  display:flex;
  flex-direction:column;

  /* ✨ smooth animation */
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}
.sidebar h2{text-align:center;margin-bottom:15px}
.sidebar button{
  width:100%;
  background:none;
  border:none;
  color:#fff;
  text-align:left;
  padding:10px;
  border-radius:6px;
  margin-bottom:5px;
}
.sidebar button:hover{background:rgba(255,255,255,.15)}
.sidebar button.active{
  background: rgba(255,255,255,0.22);
  font-weight: bold;
  position: relative;
}

.sidebar button.active::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:#fff;
  border-radius:0 4px 4px 0;
}

/* MAIN */
.main{flex:1;padding:20px;overflow:auto}
.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.low{color:var(--danger);font-weight:bold}
.btnRow{display:flex;gap:6px;margin-top:6px;flex-direction: row;}
.btnRow button{flex:1;padding:8px;border:none;border-radius:6px;color:#fff}
.reduce{background:var(--danger)}
.edit{background:#455a64}
.delete{background:#000}
.whatsapp{
  display:inline-block;
  margin-top:6px;
  padding:6px 10px;
  background:#25D366;
  color:#fff;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* RESPONSIVE */
@media (max-width: 768px){
  .mobileHeader{
    display:flex;
  }

  .app{
    flex-direction:column;
    height:auto;
  }

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100vh;
  z-index:1000;

  transform: translateX(-100%);
  box-shadow: 4px 0 12px rgba(0,0,0,0.25);
}

.sidebar.show{
  transform: translateX(0);
}

  .main{
    width:100%;
    padding:15px;
    margin-left:0;
  }
}
body::after{
  content: "© Anirudh Balaji S/O Venkatesh";
  position: fixed;
  bottom: 10px;
  right: 10px;
  font-size: 11px;
  color: rgba(0,0,0,0.15);
  pointer-events: none;
  z-index: 0;
}
body.dark::after{
  color: rgba(255,255,255,0.15);
}
.sidebar button{
  position: relative;
  overflow: hidden;
}

.sidebar button::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,0.35);
  border-radius:50%;
  transform:translate(-50%,-50%);
  transition:width 0.4s ease,height 0.4s ease,opacity 0.6s;
  opacity:0;
}

.sidebar button:active::after{
  width:220%;
  height:220%;
  opacity:1;
  transition:0s;
}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s, transform .3s;
  z-index:9999;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-6px);
}
#toast.success{background:#2e7d32}
#toast.error{background:#c62828}
#toast.info{background:#1565c0}
@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}
@media print {
  body * {
    visibility: hidden;
  }
  #billArea, #billArea * {
    visibility: visible;
  }
  #billArea {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }
}

    throw new Error("USER_PROFILE_INCOMPLETE");
  }

  return data;
};

<script>

document.addEventListener("DOMContentLoaded", ()=>{
  window.main = document.getElementById("main");
  window.fileInput = document.getElementById("fileInput");

  if(window.fileInput){
    window.fileInput.onchange = e=>{
      let r=new FileReader();
      r.onload=ev=>{
        let d=JSON.parse(ev.target.result);
        stock=d.stock||{};
        serviceHistory=d.serviceHistory||[];
        localStorage.setItem(LS("stock"), JSON.stringify(stock));
       localStorage.setItem(LS("serviceHistory"), JSON.stringify(serviceHistory));
        dashboard();
        cloudSave({ stock, serviceHistory, bills, customers, meta, activeServices: cleanActiveServices() });
      };
      r.readAsText(e.target.files[0]);
    };
  }
});

function cleanActiveServices(){
  const clean = {};

  Object.keys(window.activeServices).forEach(bike => {
    const s = window.activeServices[bike];

    clean[bike] = {
      cust: s.cust,
      phone: s.phone,
      parts: s.parts.map(p => ({
        item: p.item,
        qty: p.qty,
        price: p.price
      })),
      labour: Number(s.labour || 0),
      waterWash: Number(s.waterWash || 0),
      status: s.status,
      paymentType: s.paymentType || "paid", // ✅ THIS WAS THE BUG
      startedAt: s.startedAt
    };
  });

  return clean;
}

function syncActiveServices(){
  cloudSave({
    stock,
    serviceHistory,
    bills,
    customers,
    meta,
    activeServices: cleanActiveServices()
  });
}

function cloudSaveSafe(){
  cloudSave({
    stock,
    serviceHistory,
    bills,
    customers,
    meta,
    activeServices: cleanActiveServices()
  });
}

  const t = document.getElementById("toast");
  if(!t) return;

  t.className = "";
  t.textContent = msg;
  t.classList.add("show", type);

  setTimeout(() => {
    t.classList.remove("show");
  }, 2500);
}

function formatServiceTime(startedAt){
  if(!startedAt) return "";

  const start = new Date(startedAt).getTime();
  const now   = Date.now();

  const diffMin = Math.floor((now - start) / 60000);

  if(diffMin < 60){
    return `⏱️ ${diffMin} min ago`;
  }

  const hr  = Math.floor(diffMin / 60);
  const min = diffMin % 60;

  return `⏱️ ${hr} hr ${min} min ago`;
}

function holdService(bike){

  if(!s) return;

  s.status = "hold";
  toast("Service put on hold","info");
  renderActiveServicesSafe();
  syncActiveServices();
}

function resumeService(bike){
  const s = window.activeServices[bike];
  if(!s) return;

  // Resume to correct state
  s.status = s.parts.length > 0 ? "parts" : "started";

  toast("Service resumed","success");
  renderActiveServicesSafe();
  syncActiveServices();
}

function incItem(bike, item){
  const s = window.activeServices[bike];
  if(!s) return;

  s.status = "parts"; // 🔵 live update

  if(stock[item].qty <= 0){
    alert("Out of stock");
    return;
  }

  let found = s.parts.find(p => p.item === item);
  if(found){
    if(found.qty >= stock[item].qty){
      alert("Stock limit reached");
      return;
    }
    found.qty++;
  } else {
    s.parts.push({ item, qty: 1, price: stock[item].price });
  }
  renderActiveServicesSafe();
  syncActiveServices();
}

function decItem(bike, item){
  const s = window.activeServices[bike];
  let found = s.parts.find(p => p.item === item);
  if(!found) return;

  found.qty--;
  if(found.qty <= 0){
    s.parts = s.parts.filter(p => p.item !== item);
  }

  // 🟡 RESET STATUS IF NO PARTS LEFT
  if(s.parts.length === 0){
    s.status = "started";
  }

  renderActiveServicesSafe();
  syncActiveServices();
}

 async function confirmService(bike){
  const s = window.activeServices[bike];
  if(!s || s.parts.length === 0){
    alert("No items added");
    return;
  }

  s.waterWash = confirm("Water wash done?") ? 100 : 0;

if(s.paymentType === "paid"){
  s.labour = +prompt("Labour charge (0 for free):","0") || 0;
} else {
  s.labour = 0;
}

if(s.parts.length === 0 && s.labour === 0 && s.waterWash === 0){
  alert("Service cannot be empty");
  return;
}

  let total =
    s.parts.reduce((t,p)=>t+(p.qty*p.price),0) +
    s.waterWash +
    s.labour;

  // Reduce stock
  s.parts.forEach(p=>{
    stock[p.item].qty -= p.qty;
  });

  // Save service
  serviceHistory.unshift({
    id: "SRV-" + Date.now(),
    status: "completed",
    cust: s.cust,
    phone: s.phone,
    vehicle: bike,
    time: new Date().toISOString(),
    parts: s.parts,
    waterWash: s.waterWash,
    labour: s.labour,
    total,
    invoice:false
  });

// 1️⃣ Remove locally
delete window.activeServices[bike];

// 2️⃣ DELETE FROM FIRESTORE (THIS IS THE KEY FIX)
// 3️⃣ Save remaining data
await cloudSave({

});

// 4️⃣ UI refresh
renderActiveServicesSafe();

function revenueView(){
  if(!window.can("revenue")){
    toast("Access denied","error");
    return;
  }

  // ---------- MONTHLY REVENUE MAP ----------
    // ---------- TOP SPARE PARTS ----------
  let partStats = {};
  let monthlyMap = {};
  let free = 0, paid = 0;

    serviceHistory.forEach(s=>{
    if(!s || !s.time) return;

    let d = new Date(s.time);
    let key = d.toLocaleString("default",{month:"short"}) + " " + d.getFullYear();

    monthlyMap[key] = (monthlyMap[key] || 0) + Number(s.total || 0);

    if(Number(s.total || 0) > 0) paid++;
    else free++;

    // 🔧 collect spare usage
    if(Array.isArray(s.parts)){
      s.parts.forEach(p=>{
        partStats[p.item] = (partStats[p.item] || 0) + p.qty;
      });
    }
  });

  let maxRevenue = Math.max(...Object.values(monthlyMap), 1);
  let totalServices = free + paid || 1;

  let freePct = Math.round((free / totalServices) * 100);
  let paidPct = 100 - freePct;

  // ---------- BUILD HTML ----------
  let h = `
    <div class="card">
      <h3>💰 Revenue Overview</h3>
      <b>Total Services:</b> ${totalServices}<br>
      <b>Paid:</b> ${paid} | <b>Free:</b> ${free}
    </div>

    <div class="card">
      <h3>📊 Monthly Revenue</h3>
  `;

  Object.keys(monthlyMap).forEach(month=>{
    let amt = monthlyMap[month];
    let width = Math.round((amt / maxRevenue) * 100);

    h += `
      <div style="margin-bottom:10px">
        <b>${month}</b> — ₹${amt}
        <div style="height:12px;background:#ddd;border-radius:6px;margin-top:4px">
          <div style="height:12px;width:${width}%;background:#0a2e5c;border-radius:6px"></div>
        </div>
      </div>
    `;
  });

  if(!Object.keys(monthlyMap).length){
    h += `<p>No revenue data available</p>`;
  }
   // ---------- TOP SPARES HTML ----------
  let topParts = Object.entries(partStats)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  h += `
    <div class="card">
      <h3>🔧 Top Spare Parts Used</h3>
      <ul>
        ${
          topParts.length
            ? topParts.map(p=>`<li>${p[0]} × ${p[1]}</li>`).join("")
            : "<li>No spare data</li>"
        }
      </ul>
    </div>
  `;


  h += `
    </div>

    <div class="card">
      <h3>🆓 Free vs 💰 Paid Services</h3>

      <p>Free Services: ${free} (${freePct}%)</p>
      <div style="height:12px;background:#ddd;border-radius:6px">
        <div style="height:12px;width:${freePct}%;background:#4caf50;border-radius:6px"></div>
      </div>

      <br>

      <p>Paid Services: ${paid} (${paidPct}%)</p>
      <div style="height:12px;background:#ddd;border-radius:6px">
        <div style="height:12px;width:${paidPct}%;background:#0a2e5c;border-radius:6px"></div>
      </div>
    </div>
  `;

  main.innerHTML = h;
}

function generateBillFromService(serviceId){

  if(!svc){
    alert("Service not found");
    return;
  }
svc.invoice = true;
  const bill = {
    billNo: "BM-" + localStorage.invoiceNo.padStart(4,"0"),
    phone: svc.phone,
    vehicle: svc.vehicle,
    date: new Date().toISOString(),
    items: svc.parts,
    labour: svc.labour,
    total: svc.total
  };

  bills.unshift(bill);

  localStorage.invoiceNo = (+localStorage.invoiceNo + 1).toString();
  localStorage.setItem(LS("bills"), JSON.stringify(bills));

  cloudSaveSafe();

  // 👉 OPEN BILL VIEW
  reprintBill(0);
}

function isServiceDue(service){
  const last = new Date(service.time);
  const now = new Date();

  const diffDays = Math.floor(
    (now - last) / (1000 * 60 * 60 * 24)
  );

  return diffDays >= 90;
}


function setCustomLabour(){
  let val = +document.getElementById("customLabour").value || 0;
  selectedLabour = val;
  document.getElementById("labourValue").innerText = val;
}
function checkBackupReminder(){
  if (!meta || typeof meta !== "object") meta = {};

  if (!meta.lastBackup) return;

  let last = new Date(meta.lastBackup);
  if (isNaN(last)) return;

  let now = new Date();

  let diffDays = Math.floor(
    (now - last) / (1000 * 60 * 60 * 24)
  );

  if(diffDays >= 7){
    alert("⚠️ Last backup was " + diffDays + " days ago. Please export backup.");
  }
}

function filterStock(){
  let q = document.getElementById("stockSearch").value.toLowerCase();
  document.querySelectorAll(".stockItem").forEach(card=>{
    let name = card.getAttribute("data-name");
    card.style.display = name.includes(q) ? "block" : "none";
  });
}

async function saveShowroomSettings(){

  const name = document.getElementById("ss_name").value.trim();
  const phone = document.getElementById("ss_phone").value.trim();
  const address = document.getElementById("ss_address").value.trim();
  const file = document.getElementById("ss_logo").files[0];

  if(!name){
    alert("Showroom name required");
    return;
  }

  let logoURL = window.showroomProfile?.logo || "";

  if(file){
    const logoRef = ref(storage, "showroom-logos/" + currentShowroom + ".png");
    await uploadBytes(logoRef, file);
    logoURL = await getDownloadURL(logoRef);
  }

  await setDoc(doc(db,"showrooms",currentShowroom),{
    name,
    phone,
    address,
    logo: logoURL
  },{ merge:true });

  window.showroomProfile = { ...window.showroomProfile, name, phone, address, logo: logoURL };
  applyShowroomBranding();
  
const prev = document.getElementById("logoPreview");
if(prev && logoURL){
  prev.src = logoURL + "?t=" + Date.now();
  prev.style.display = "block";
}
  
  alert("Showroom updated successfully");
}
