<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balaji Motors – Anavatti</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#0a2e5c;
  --bg:#f2f5f9;
  --card:#ffffff;
  --text:#000;
  --danger:#c62828;
}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#121212;--card:#1e1e1e;--text:#fff}

.app{display:flex;height:100vh}
.sidebar{width:240px;background:var(--blue);color:#fff;padding:15px}
.sidebar h2{text-align:center}
.sidebar button{
  width:100%;border:none;background:none;color:#fff;
  text-align:left;padding:12px;border-radius:6px;margin-bottom:6px;
}
.sidebar button:hover{background:rgba(255,255,255,.15)}
.main{flex:1;padding:20px;overflow:auto}

.card{background:var(--card);padding:15px;border-radius:10px;margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1)}

.bigBtn{font-size:18px;padding:15px}
.low{color:var(--danger);font-weight:bold}

.whatsapp{display:inline-block;padding:8px 12px;background:#25D366;
  color:#fff;border-radius:6px;text-decoration:none}

.mobileHeader{display:none;background:var(--blue);color:#fff;padding:10px}
.mobileHeader button{background:none;border:none;color:#fff;font-size:22px}

@media(max-width:768px){
  .mobileHeader{display:flex}
  .app{flex-direction:column}
  .sidebar{position:fixed;left:-260px;top:0;height:100%;transition:.3s}
  .sidebar.show{left:0}
}
</style>
</head>

<body>

<div class="mobileHeader">
  <button onclick="toggleSidebar()">☰</button>
  <b>Balaji Motors</b>
</div>

<div class="app" id="app">

<div class="sidebar">
  <h2>Balaji Motors</h2>

  <button data-adv onclick="dashboard()">🏠 Dashboard</button>
  <button data-simple onclick="stockView()">📦 Stock</button>
  <button data-adv onclick="lowStockView()">⚠️ Low Stock</button>

  <button data-simple onclick="generateBill()">🧾 Bill</button>
  <button data-adv onclick="savedBills()">🖨 Bills</button>

  <button data-adv onclick="monthlyReport()">📊 Revenue</button>
  <button data-adv onclick="searchView()">🔍 Search</button>

  <button data-adv onclick="exportData()">📤 Export</button>
  <button data-adv onclick="toggleTheme()">🌙 Theme</button>

  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="main" id="main"></div>
</div>

<script>
/* ===== SECURITY & MODE ===== */
if(!localStorage.ownerPin) localStorage.ownerPin="2580";
if(!localStorage.staffPin) localStorage.staffPin="1111";
let role="owner", mode="advanced";

function login(){
  let p=prompt("Enter PIN");
  if(p===localStorage.ownerPin){role="owner";mode="advanced"}
  else if(p===localStorage.staffPin){role="staff";mode="simple"}
  else return login();
  applyMode();
  dashboard();
}
login();

function applyMode(){
  document.querySelectorAll("[data-adv]").forEach(b=>{
    b.style.display = mode==="advanced"?"block":"none";
  });
}

function logout(){location.reload()}
function toggleSidebar(){document.querySelector(".sidebar").classList.toggle("show")}

/* ===== DATA (SAFE) ===== */
let stock=JSON.parse(localStorage.stock||"{}");
let history=JSON.parse(localStorage.history||"[]");
let bills=JSON.parse(localStorage.bills||"[]");
let customers=JSON.parse(localStorage.customers||"{}");
let meta=JSON.parse(localStorage.meta||"{}");
if(!localStorage.invoiceNo) localStorage.invoiceNo="1";

/* ===== AUTO BUILD CUSTOMER PROFILE (Feature 1,2) ===== */
history.forEach(h=>{
  if(!customers[h.phone]){
    customers[h.phone]={name:h.cust,vehicle:h.vehicle,visits:0}
  }
  customers[h.phone].visits++;
});
localStorage.customers=JSON.stringify(customers);

/* ===== DASHBOARD ===== */
function dashboard(){
  let m=new Date().getMonth(), y=new Date().getFullYear();
  let monthlyBills=bills.filter(b=>{
    let d=new Date(b.date);
    return d.getMonth()==m && d.getFullYear()==y;
  });
  let revenue=monthlyBills.reduce((s,b)=>s+b.total,0);

  main.innerHTML=`
    <div class="card">
      <h3>Dashboard</h3>
      Monthly Revenue: ₹${revenue}<br>
      Total Customers: ${Object.keys(customers).length}
    </div>`;
}

/* ===== STOCK ===== */
function stockView(){
  let h="";
  Object.keys(stock).forEach(i=>{
    h+=`<div class="card">
      <b>${i}</b><br>Qty: ${stock[i].qty}
      ${stock[i].qty<=5?'<span class="low"> LOW</span>':""}
      <br><br>
      <button class="bigBtn" onclick="useStock('${i}')">➖ Reduce</button>
    </div>`;
  });
  main.innerHTML=h;
}

function useStock(i){
  let q=+prompt("Qty");
  let cust=prompt("Customer");
  let phone=prompt("Phone");
  let vehicle=prompt("Vehicle");
  let staff=prompt("Staff");

  stock[i].qty-=q;
  let time=new Date().toLocaleString();
  history.unshift({cust,phone,vehicle,item:i,qty:q,staff,time});
  localStorage.stock=JSON.stringify(stock);
  localStorage.history=JSON.stringify(history);

  let msg=`Hello ${cust}, your vehicle ${vehicle} service is completed.`;
  main.innerHTML=`<div class="card">
    Saved ✔️<br>
    <a class="whatsapp" target="_blank"
    href="https://wa.me/91${phone}?text=${encodeURIComponent(msg)}">WhatsApp</a>
  </div>`;
}

/* ===== LOW STOCK (3) ===== */
function lowStockView(){
  let h=`<div class="card"><h3>Low Stock</h3></div>`;
  Object.keys(stock).forEach(i=>{
    if(stock[i].qty<=5) h+=`<div class="card">${i} - ${stock[i].qty}</div>`;
  });
  main.innerHTML=h;
}

/* ===== BILLING (7,8) ===== */
function generateBill(){
  let phone=prompt("Phone");
  let vehicle=prompt("Vehicle");
  let labour=+prompt("Labour (₹) [150 / 300 / 500]")||0;
  let billNo="BM-"+localStorage.invoiceNo.padStart(4,"0");

  let today=new Date().toDateString();
  let items=history.filter(h=>h.phone===phone&&h.vehicle===vehicle&&new Date(h.time).toDateString()===today);
  if(!items.length) return alert("No service");

  let rows="",total=labour;
  items.forEach(i=>{
    let price=stock[i.item]?.price||0;
    let amt=price*i.qty;
    total+=amt;
    rows+=`<tr><td>${i.item}</td><td>${i.qty}</td><td>₹${amt}</td></tr>`;
  });

  bills.unshift({billNo,phone,vehicle,date:new Date(),total});
  localStorage.bills=JSON.stringify(bills);
  localStorage.invoiceNo=(+localStorage.invoiceNo+1)+"";

  main.innerHTML=`
    <div class="card">
      <h3>Bill ${billNo}</h3>
      <table border="1" width="100%">${rows}</table>
      <h2>Total ₹${total}</h2>
      <button onclick="window.print()">Print</button>
    </div>`;
}

/* ===== SAVED BILLS (7) ===== */
function savedBills(){
  let h=`<div class="card"><h3>Saved Bills</h3></div>`;
  bills.forEach(b=>h+=`<div class="card">${b.billNo} - ₹${b.total}</div>`);
  main.innerHTML=h;
}

/* ===== REVENUE (6) ===== */
function monthlyReport(){
  let today=new Date();
  let daily=bills.filter(b=>new Date(b.date).toDateString()===today.toDateString());
  let dailyTotal=daily.reduce((s,b)=>s+b.total,0);
  main.innerHTML=`<div class="card">
    <h3>Revenue</h3>
    Today: ₹${dailyTotal}<br>
    This Month: ₹${bills.reduce((s,b)=>s+b.total,0)}
  </div>`;
}

/* ===== SEARCH (1,2) ===== */
function searchView(){
  let q=prompt("Name / Phone");
  let h="";
  Object.keys(customers).forEach(p=>{
    let c=customers[p];
    if(c.name.toLowerCase().startsWith(q.toLowerCase())){
      h+=`<div class="card">
        ${c.name} (${p})<br>
        Visits: ${c.visits}${c.visits>1?" ⭐ Repeat":""}
      </div>`;
    }
  });
  main.innerHTML=h||"<div class='card'>No result</div>";
}

/* ===== BACKUP (9) ===== */
function exportData(){
  meta.lastBackup=new Date().toLocaleString();
  localStorage.meta=JSON.stringify(meta);
  let b=new Blob([JSON.stringify({stock,history,bills,customers,meta},null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="balaji-backup.json";
  a.click();
}

/* ===== THEME ===== */
if(localStorage.theme==="dark") document.body.classList.add("dark");
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.theme=document.body.classList.contains("dark")?"dark":"light";
}
</script>
</body>
</html>
