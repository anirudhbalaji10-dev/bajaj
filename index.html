:root{

/* SPLASH */
#splash{
  position:fixed;inset:0;

/* MOBILE HEADER */
.mobileHeader{
  display:none;
  background:var(--blue);
  color:#fff;
  padding:10px;
  align-items:center;
  gap:10px;
}
.mobileHeader button{
  background:none;border:none;color:#fff;font-size:22px;
}

/* LAYOUT */
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:var(--blue);

.sidebar h2{text-align:center;margin-bottom:15px}
.sidebar button{

  border:none;

/* MAIN */
.main{flex:1;padding:20px;overflow:auto}
.card{
  background:var(--card);

}
.low{color:var(--danger);font-weight:bold}
.btnRow{display:flex;gap:6px;margin-top:6px;flex-direction: row;}
.btnRow button{flex:1;padding:8px;border:none;border-radius:6px;color:#fff}
.reduce{background:var(--danger)}
.edit{background:#455a64}
.delete{background:#000}
.whatsapp{
  display:inline-block;
  margin-top:6px;
  padding:6px 10px;
  background:#25D366;
  color:#fff;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* RESPONSIVE */
@media (max-width: 768px){
  .mobileHeader{
    display:flex;
  }

  .app{
    flex-direction:column;
    height:auto;
  }

  .sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:260px;
    height:100vh;
    z-index:1000;

  .sidebar.show{

    margin-left:0;

body::after{
  content: "© Anirudh Balaji S/O Venkatesh";

  z-index: 0;

body.dark::after{

from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
window.currentUID = "";
window.role = "staff";
window.currentShowroom = "";
window.stock = {};
window.serviceHistory = [];
window.bills = [];
window.customers = {};
window.meta = {};
window.applyShowroomBranding = () => {
  const name = window.showroomProfile?.name || "My Showroom";

  document.getElementById("showroomTitle").innerText = name;
  document.getElementById("showroomHeader").innerText = name;
  document.getElementById("sidebarShowroom").innerText = name;

  const dash = document.getElementById("dashShowroom");
  if(dash) dash.innerText = name;

  const loginTitle = document.getElementById("loginShowroomTitle");
  if(loginTitle) loginTitle.innerText = name;

  const footer = document.getElementById("footerShowroom");
  if(footer) footer.innerText = name;
};

window.getUserProfile = async (uid) => {
  const snap = await getDoc(doc(db, "users", uid));
  if(!snap.exists()){
    throw "User profile not found in database";
  }
  return snap.data();
};  

window.getShowroomProfile = async (sid) => {
  const snap = await getDoc(doc(db,"showrooms", sid));
  return snap.exists() ? snap.data() : null;
};

window.cloudLoad = async () => {
  if(!window.currentShowroom) return null;
  const snap = await getDoc(doc(db,"showrooms", window.currentShowroom, "app","data"));
  return snap.exists() ? snap.data() : null;
};
  
onAuthStateChanged(auth, async (user) => {

  const loginBox = document.getElementById("loginBox");
  const appBox   = document.getElementById("app");
  if(!loginBox || !appBox) return;

  if(!user){
    loginBox.style.display = "block";
    appBox.style.display = "none";
    return;
  }

  window.currentUID = user.uid;
  localStorage.currentUID = window.currentUID;

  let profile;
  try{
    profile = await getUserProfile(user.uid);
  }catch(e){
    alert("User profile missing. Please login again.");
    await auth.signOut();
    return;
  }

  if(profile.role === "revoked"){
    alert("Your access has been revoked.");
    await auth.signOut();
    return;
  }

  window.role = profile.role;
  window.currentShowroom = profile.showroomId;

  loginBox.style.display = "none";
  appBox.style.display = "flex";

  setTimeout(() => {
    const sp = document.getElementById("splash");
    if(sp) sp.style.display = "none";
  }, 400);

  window.showroomProfile = await getShowroomProfile(window.currentShowroom) || {};
  applyShowroomBranding();

  const cloudData = await window.cloudLoad();

  if(cloudData){
    stock = cloudData.stock || {};
    serviceHistory = cloudData.serviceHistory || [];
    bills = cloudData.bills || [];
    customers = cloudData.customers || {};
    meta = cloudData.meta || {};
  } else {
    stock = JSON.parse(localStorage.stock || "{}");
    serviceHistory = JSON.parse(localStorage.serviceHistory || "[]");
    bills = JSON.parse(localStorage.bills || "[]");
    customers = JSON.parse(localStorage.customers || "{}");
    meta = JSON.parse(localStorage.meta || "{}");
  }

  localStorage.stock = JSON.stringify(stock);
  localStorage.serviceHistory = JSON.stringify(serviceHistory);
  localStorage.bills = JSON.stringify(bills);
  localStorage.customers = JSON.stringify(customers);
  localStorage.meta = JSON.stringify(meta);

  const waitForMain = () => {
    if(window.main){
      dashboard();
    } else {
      setTimeout(waitForMain, 100);
    }
  };
  waitForMain();
});

      
window.db = db;
window.fbSetDoc = setDoc;
window.fbDoc = doc;

window.firebaseLogin = (email, pass) =>
  signInWithEmailAndPassword(auth, email, pass);

window._cloudSave = async (data) => {
  if(!auth.currentUser || !window.currentShowroom) return;
  try{
    data._lastUpdated = new Date().toISOString();
    data._by = window.currentUID;

    await setDoc(
      doc(db,"showrooms",window.currentShowroom,"app","data"),
      data,
      { merge:true }
    );
  }catch(e){
    console.error("Cloud save failed", e);
  }
};


document.addEventListener("DOMContentLoaded", () => {

  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");

  if(loginBtn){
    loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;

  if(!email || !pass){
    alert("Enter email and password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    if(e.code === "auth/user-not-found")
      alert("Account not found. Please create account first.");
    else if(e.code === "auth/wrong-password")
      alert("Incorrect password.");
    else
      alert(e.message);
  }
});

  if(signupBtn){
    signupBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("password").value;
  const code  = document.getElementById("showroomCode").value.trim();

  if(!email || !pass){
    alert("Enter email and password");
    return;
  }

  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = userCred.user.uid;

    if(code){
      // STAFF JOIN FLOW
      const codeSnap = await getDoc(doc(db,"showroomCodes", code));
      if(!codeSnap.exists()){
        alert("Invalid Showroom Code");
        await userCred.user.delete();
        return;
      }

      const showroomId = codeSnap.data().showroomId;

      await setDoc(doc(db,"users",uid),{
        role:"staff",
        showroomId
      });

      alert("Staff account created. Please login.");
    } 
    else {
      // OWNER CREATE FLOW
      const showroomId = "SR-" + Date.now();
      const showroomCode = Math.floor(100000 + Math.random()*900000).toString();

     const showroomName = document.getElementById("showroomName").value.trim();

await setDoc(doc(db,"showrooms", showroomId),{
  ownerUID: uid,
  code: showroomCode,
  name: showroomName || "My Showroom",
  phone: "",
  address: "",
  logo: "",
  createdAt: new Date().toISOString()
});
      await setDoc(doc(db,"showroomCodes", showroomCode),{
        showroomId
      });

      await setDoc(doc(db,"users",uid),{
        role:"owner",
        showroomId
      });

      alert("Your Showroom Code: " + showroomCode);
    }

    await auth.signOut();
    location.reload();
  }
  catch(e){
    alert(e.message);
  }
  });
 }
    

window.logout = async function(){
  await auth.signOut();
  localStorage.removeItem("currentUID");
  location.reload();
};

</script>

<script>

};

/* STOCK */
function stockView(){
  let h = `
  <div class="card">
    <input type="text" id="stockSearch" placeholder="Search spare..." 
      onkeyup="filterStock()" style="width:100%;padding:10px;font-size:16px;">
  </div>
`;
  if(role==="owner") h+=`<button onclick="addStock()">➕ Add Stock</button>`;
  h+=`</div>`;
  for(let i in stock){
    let low=stock[i].qty<=5?'<span class="low"> LOW</span>':'';
    h+=`
    <div class="card stockItem" data-name="${i.toLowerCase()}">
      <b>${i}</b><br>
      Qty: ${stock[i].qty}${low}
      <div class="btnRow">
        <button class="reduce ${role==='staff'?'big-btn':''}" onclick="useStock('${i}')">
  Reduce
</button>
        ${role==="owner"?`
        <button class="edit" onclick="editStock('${i}')">Edit</button>
        <button class="delete" onclick="delStock('${i}')">Delete</button>
        `:""}
      </div>
    </div>`;
  }
  if(!Object.keys(stock).length) h+=`<div class="card">No stock</div>`;
  main.innerHTML=h;
  localStorage.stock=JSON.stringify(stock);
}


function addStock(){
  let n=prompt("Spare name"),q=+prompt("Qty"),c=+prompt("Cost");
  if(!n||q<0) return;
  let price = +prompt("Selling price (GST included)");
stock[n] = { qty: q, cost: c, price: price };
  stockView();
  cloudSave({ stock, serviceHistory, bills, customers, meta });
}
function editStock(i){
  let q=+prompt("Qty"); if(q<0) return;
  stock[i].qty=q;
  stockView();
  cloudSave({ stock, serviceHistory, bills, customers, meta });
}
function delStock(i){
  if(confirm("Delete?")){delete stock[i];stockView();cloudSave({ stock, serviceHistory, bills, customers, meta });}
}
function useStock(i){
  let q = +prompt("Quantity used:");
  let phone = prompt("Phone (10 digits):");
  if(!/^\d{10}$/.test(phone)) return alert("Invalid phone");

  let cust = customers[phone]?.name || prompt("Customer name:");
  let vehicle = customers[phone]?.vehicle || prompt("Vehicle number:");
  let staff = prompt("Staff name:");
  // 🔹 Save / update customer profile
if(!customers[phone]){
  customers[phone] = {
    name: cust,
    vehicle: vehicle,
    visits: 1
  };
} else {
  customers[phone].visits++;
  customers[phone].vehicle = vehicle; // update latest vehicle
}

localStorage.customers = JSON.stringify(customers);

  if(
    !cust || 
    !vehicle || 
    !staff || 
    !/^\d{10}$/.test(phone) || 
    stock[i].qty < q
  ){
    alert("Invalid input");
    return;
  }

  stock[i].qty -= q;

  let time = new Date().toLocaleString();

  serviceHistory.unshift({
    cust,
    phone,
    vehicle,
    item: i,
    qty: q,
    staff,
    time
  });

  localStorage.serviceHistory = JSON.stringify(serviceHistory);
  localStorage.stock = JSON.stringify(stock);
  cloudSave({ stock, serviceHistory, bills, customers, meta });

  let msg =
`Hello ${cust},
Dear Sir/Madam ,

Your vehicle ${vehicle} service is completed at
${window.showroomProfile?.name || "Our Service Center"}

🛠️ Service Date: ${time}
👨‍🔧 Serviced by: ${staff}

Thank you for visiting Authorised Service.`;

  main.innerHTML = `
    <div class="card">
      <h3>Service Saved</h3>
      <p><b>Customer:</b> ${cust}</p>
      <p><b>Vehicle:</b> ${vehicle}</p>
      <p><b>Staff:</b> ${staff}</p>
      <p><b>Date:</b> ${time}</p>

      <a class="whatsapp"
         href="https://wa.me/91${phone}?text=${encodeURIComponent(msg)}"
         target="_blank">
         📲 Send WhatsApp Message
      </a>

      <br><br>
      <button onclick="stockView()">⬅ Back to Stock</button>
    </div>
  `;
}
//Revenue view
function revenueView(){
  let today = new Date();
  let todayStr = today.toDateString();

  let dailyTotal = 0;
  let monthlyTotal = 0;

  bills.forEach(b=>{
    let d = new Date(b.date);

    // Daily
    if(d.toDateString() === todayStr){
      dailyTotal += b.total;
    }

    // Monthly
    if(
      d.getMonth() === today.getMonth() &&
      d.getFullYear() === today.getFullYear()
    ){
      monthlyTotal += b.total;
    }
  });

  main.innerHTML = `
    <div class="card">
      <h3>Revenue Summary</h3>
      <p><b>Today:</b> ₹${dailyTotal}</p>
      <p><b>This Month:</b> ₹${monthlyTotal}</p>
    </div>
  `;
}

/* MONTHLY */
function monthlyCustomers(){
  let y=+prompt("Year"),m=+prompt("Month (1-12)")-1;
  let list=serviceHistory.filter(x=>{
    let d=new Date(x.time);
    return d.getFullYear()==y&&d.getMonth()==m;
  });
  if(!list.length){main.innerHTML=`<div class="card">No data</div>`;return;}
  let h=`<div class="card"><h3>${m+1}/${y}</h3></div>`;
  list.forEach(x=>{
    h+=`<div class="card">${x.cust} (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;
  });
  main.innerHTML=h;
}

/* SEARCH */
function searchView(){
  let q = prompt("Customer name / Vehicle");
  if(!q) return;

  let list = serviceHistory.filter(x =>
    x.cust.toLowerCase().startsWith(q.toLowerCase()) ||
    x.vehicle.toLowerCase().includes(q.toLowerCase())
  );

  if(!list.length){
    main.innerHTML = `<div class="card">No record</div>`;
    return;
  }

  let h = `<div class="card"><h3>Results</h3></div>`;

  list.forEach(x=>{
    let repeatTag = customers[x.phone]?.visits > 1 ? " ⭐ Repeat Customer" : "";
    h += `
      <div class="card">
        <b>${x.cust}</b>${repeatTag}<br>
        Phone: ${x.phone}<br>
        Vehicle: ${x.vehicle}<br>
        Last Service: ${x.time}
      </div>
    `;
  });

  main.innerHTML = h;
}


/* INVOICE */
function invoiceView(){
  let no=localStorage.invoiceNo.padStart(4,"0");
  let total=0;
  serviceHistory.slice(0,5).forEach(x=>{
    total+=x.qty*(stock[x.item]?.cost||0);
  });
  let gst=total*0.18;
  main.innerHTML=`
  <div class="card">
    Invoice No: BM-${no}<br>
    Total: ₹${total}<br>
    GST (18%): ₹${gst}<br>
    <b>Grand: ₹${total+gst}</b>
  </div>`;
}

/* serviceHistory */
function serviceHistoryView(){
  if(!serviceHistory.length){main.innerHTML=`<div class="card">No serviceHistory</div>`;return;}
  let h=`<div class="card"><h3>serviceHistory</h3></div>`;
  serviceHistory.forEach(x=>{let repeat =
  customers[x.phone]?.visits > 1
    ? " ⭐ Repeat"
    : "";
    h+=`<div class="card"><b>${x.cust}</b>${repeat}<br> (${x.phone})<br>${x.vehicle}<br>${x.item} - ${x.qty}<br>${x.time}</div>`;
  });
  main.innerHTML=h;
}

/* EXPORT / IMPORT */
function exportData(){
  meta.lastBackup = new Date().toISOString();
localStorage.meta = JSON.stringify(meta);
  let b=new Blob([JSON.stringify({stock,serviceHistory},null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(b);

    `;

     style="max-width:90px;${window.showroomProfile.logo?'':'display:none'}"><br>

}

        <td>Labour Charge</td>
        <td>—</td>
        <td>₹${labour}</td>
      </tr>`;
}

function printBill(){
  if(!currentBill || !currentBill.phone){
  alert("Please generate bill first");

}

function lowStockView(){
  let h = `<div class="card"><h3>Low Stock Items</h3></div>`;
  let found = false;

  for(let item in stock){
    if(stock[item].qty <= 5){
      found = true;
      h += `
        <div class="card">
          <b>${item}</b><br>
          Quantity Left: <span class="low">${stock[item].qty}</span>
        </div>
      `;

  }

  if(!found){
    h += `<div class="card">✅ No low stock items</div>`;
  }

  main.innerHTML = h;

function setLabour(amount){
  selectedLabour = amount;
  document.getElementById("labourValue").innerText = amount;
}

function setCustomLabour(){
  let val = +document.getElementById("customLabour").value || 0;
  selectedLabour = val;
  document.getElementById("labourValue").innerText = val;
}
function checkBackupReminder(){
  if(!meta.lastBackup) return;

  let last = new Date(meta.lastBackup);
  let now = new Date();

  let diffDays = Math.floor(
    (now - last) / (1000 * 60 * 60 * 24)
  );

  if(diffDays >= 7){
    alert("⚠️ Last backup was " + diffDays + " days ago. Please export backup.");
  }
}

function filterStock(){
  let q = document.getElementById("stockSearch").value.toLowerCase();
  document.querySelectorAll(".stockItem").forEach(card=>{
    let name = card.getAttribute("data-name");
    card.style.display = name.includes(q) ? "block" : "none";
  });
}

async function saveShowroomSettings(){

  const name = document.getElementById("ss_name").value.trim();
  const phone = document.getElementById("ss_phone").value.trim();
  const address = document.getElementById("ss_address").value.trim();
  const file = document.getElementById("ss_logo").files[0];

  if(!name){
    alert("Showroom name required");
    return;
  }

  let logoURL = window.showroomProfile.logo || "";

  if(file){
    const logoRef = ref(storage, "showroom-logos/" + currentShowroom + ".png");
    await uploadBytes(logoRef, file);
    logoURL = await getDownloadURL(logoRef);
  }

  await setDoc(doc(db,"showrooms",currentShowroom),{
    name,
    phone,
    address,
    logo: logoURL
  },{ merge:true });

  window.showroomProfile = { ...window.showroomProfile, name, phone, address, logo: logoURL };
  applyShowroomBranding();
  
const prev = document.getElementById("logoPreview");
if(prev && logoURL){
  prev.src = logoURL + "?t=" + Date.now();
  prev.style.display = "block";
}
  
  alert("Showroom updated successfully");
}
